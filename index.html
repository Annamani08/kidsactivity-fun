<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Activity Fun</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Ensure smooth font rendering */
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-primary': '#FF6347', // Tomato Red - Vibrant and Playful
            'brand-secondary': '#FFD700', // Gold - Cheerful
            'brand-accent': '#32CD32',   // Lime Green - Energetic
            'brand-text': '#4A5568',     // Cool Gray 700 - Readable Text (Tailwind's gray.700)
            'brand-bg-light': '#FFFBEB', // Yellow 50 - Light, Warm Background (Tailwind's yellow.50)
          },
          animation: {
            fadeIn: 'fadeIn 0.5s ease-out forwards',
            shake: 'shake 0.5s ease-in-out forwards',
          },
          keyframes: {
            fadeIn: {
              'from': { opacity: '0', transform: 'translateY(10px)' },
              'to': { opacity: '1', transform: 'translateY(0)' },
            },
            shake: {
              '0%': { transform: 'translateX(0)' },
              '10%, 30%, 50%, 70%, 90%': { transform: 'translateX(-6px)' },
              '20%, 40%, 60%, 80%': { transform: 'translateX(6px)' },
              '100%': { transform: 'translateX(0)' },
            }
          },
          boxShadow: {
            '3xl': '0 35px 60px -15px rgba(0, 0, 0, 0.3)',
          }
        }
      }
    }
  </script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "react/": "https://esm.sh/react@^19.1.0/",
    "@google/genai": "https://esm.sh/@google/genai@^1.3.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <!-- React app will be injected here -->
<script type="module" src="/index.tsx"></script>
</body>
</html>
